services:
  postgres:
    image: postgres:16
    container_name: perftest-postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  spring-server:
    build: ./spring-server
    container_name: perftest-spring
    profiles: ["spring"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shop
      DB_USER: shop
      DB_PASSWORD: shop
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2}"
          memory: 1g

  python-server:
    build: ./python-server
    container_name: perftest-python
    profiles: ["python"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: shop
      DB_USER: shop
      DB_PASSWORD: shop
      DB_POOL_SIZE: "10"
      WEB_CONCURRENCY: "${APP_CPUS:-2}"
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2}"
          memory: 1g

  csharp-server:
    build: ./csharp-server
    container_name: perftest-csharp
    profiles: ["csharp"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8083
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=shop;Username=shop;Password=shop;Maximum Pool Size=10"
    ports:
      - "8083:8083"
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2}"
          memory: 1g

  grafana:
    image: grafana/grafana-oss:latest
    container_name: perftest-grafana
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

volumes:
  grafana-data: